name: Build apps (Windows and Mac)

# Releases publish themselves: when a push to main changes VERSION in panelgen.py to one that has no release yet,
# this tests it on Windows and on a Mac (Apple Silicon), builds both zips and publishes release v<VERSION> as the
# latest release, with CHANGELOG.md's notes. If a test fails on either one, nothing is published.
# Any other push to main is tested only.
# "Run workflow" on the Actions tab makes test builds (download them from the run's Artifacts).
on:
  push:
    branches: [main]
    paths: ['panelgen.py', 'panelgen_gui.pyw', 'panel_rules.json', 'requirements.txt', 'tools/**', 'pcm/**', 'kicad-plugin/**', 'LICENSE', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Which version is this, and is it released yet?
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path panelgen.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          gh release view "v$ver" --repo $env:GITHUB_REPOSITORY *> $null
          $new = if ($LASTEXITCODE -ne 0 -and $env:GITHUB_EVENT_NAME -eq 'push') { 'yes' } else { 'no' }
          $global:LASTEXITCODE = 0
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PUBLISH=$new" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=$new" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # this version's part of the changelog becomes the release notes
          $notes = @(); $on = $false
          foreach ($l in Get-Content CHANGELOG.md) {
            if ($l -match '^## ') { if ($on) { break }; $on = ($l.Trim() -eq "## $ver"); continue }
            if ($on) { $notes += $l }
          }
          if (-not $notes) { $notes = @("Version $ver.") }
          $notes | Set-Content notes.md -Encoding utf8
          Write-Host "version $ver, publish: $new"

      - name: Check the engine works on the example board
        run: python panelgen.py examples/eurorack/Eurorack_8HP_test.kicad_pcb -o ci_check.kicad_pcb

      - name: Check the window works (mouse, extra holes, ruler, undo, generate)
        run: python tools/ci_smoke.py

      - name: Check a KiCad 10 PCB gives a KiCad 10 panel
        run: python tools/ci_kicad10.py

      - name: Build PanelGenerator.exe
        run: pyinstaller --noconfirm --clean --windowed --name PanelGenerator --collect-data sv_ttk --hidden-import panelgen panelgen_gui.pyw

      - name: Check the packaged app starts with its proper look
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/PanelGenerator/PanelGenerator.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { throw "the packaged app failed its start-up check (exit $($p.ExitCode))" }

      - name: Put the release folder together
        shell: pwsh
        run: |
          $out = "dist/PanelGenerator"
          Copy-Item panel_rules.json, README.md, LICENSE, LICENSING.md $out
          Copy-Item (Get-ChildItem pcm/*_pcm.zip | Select-Object -First 1).FullName "$out/KiCad-button-plugin.zip"
          Copy-Item -Recurse PanelParts.pretty, Eurorack.pretty, examples, kicad-plugin $out
          $ver = if ($env:PUBLISH -eq 'yes') { "v$($env:VER)" } else { "test-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path $out -DestinationPath "PanelGenerator-$ver-windows.zip"
          "ZIP=PanelGenerator-$ver-windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: PanelGenerator-windows
          path: ${{ env.ZIP }}

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build-mac:
    runs-on: macos-latest        # Apple Silicon: the app runs on M1 Macs and later
    needs: build                 # for the version number
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Check the engine works on the example board
        run: python panelgen.py examples/eurorack/Eurorack_8HP_test.kicad_pcb -o ci_check.kicad_pcb

      - name: Check the window works (mouse, extra holes, ruler, undo, generate)
        run: python tools/ci_smoke.py

      - name: Check a KiCad 10 PCB gives a KiCad 10 panel
        run: python tools/ci_kicad10.py

      - name: Build PanelGenerator.app
        run: |
          pyinstaller --noconfirm --clean --windowed --name PanelGenerator \
            --osx-bundle-identifier com.github.lonesoulsurfer.panelgenerator \
            --collect-data sv_ttk --hidden-import panelgen \
            --add-data panel_rules.json:. --add-data kicad-plugin:kicad-plugin \
            panelgen_gui.pyw

      - name: Check the packaged app starts with its proper look
        run: |
          set +e
          dist/PanelGenerator.app/Contents/MacOS/PanelGenerator --selftest
          code=$?
          [ -f selftest.txt ] && cat selftest.txt
          exit $code

      - name: Put the release folder together
        env:
          VER: ${{ needs.build.outputs.ver }}
          PUBLISH: ${{ needs.build.outputs.publish }}
        run: |
          out=release/PanelGenerator
          mkdir -p $out
          cp -R dist/PanelGenerator.app $out/
          cp panel_rules.json README.md LICENSE LICENSING.md $out/
          cp "$(ls pcm/*_pcm.zip | tail -1)" $out/KiCad-button-plugin.zip
          cp -R PanelParts.pretty Eurorack.pretty examples kicad-plugin $out/
          if [ "$PUBLISH" = yes ]; then v="v$VER"; else v="test-${GITHUB_SHA::7}"; fi
          zip=PanelGenerator-$v-mac.zip
          ditto -c -k --keepParent $out $zip
          echo "ZIP=$zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: PanelGenerator-mac
          path: ${{ env.ZIP }}

  publish:
    runs-on: ubuntu-latest
    needs: [build, build-mac]    # only when both apps passed their tests
    if: github.event_name == 'push'
    env:
      VER: ${{ needs.build.outputs.ver }}
      PUBLISH: ${{ needs.build.outputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true

      - name: Publish the release
        if: env.PUBLISH == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: Panel Generator ${{ env.VER }}
          body_path: dl/notes.md
          files: dl/PanelGenerator-*.zip
          prerelease: false
          make_latest: true

      - name: Make sure this version's release is a full one (shown on the repo's front page)
        if: env.PUBLISH != 'yes'
        run: |
          pre=$(gh release view "v$VER" --repo $GITHUB_REPOSITORY --json isPrerelease --jq .isPrerelease)
          if [ "$pre" = true ]; then gh release edit "v$VER" --repo $GITHUB_REPOSITORY --prerelease=false --latest; fi
